name = "golabeyasamin"
main = "index.js"
compatibility_date = "2026-07-01"

# عکس محصولات (public/img) مستقیم از همین Worker سرو می‌شوند
[assets]
directory = "./public"

# ==========================================
# تنظیمات لاگ و مانیتورینگ
# ==========================================
[observability.logs]
enabled = true
invocation_logs = true

# ==========================================
# زمان‌بندی: هر دقیقه سفارش‌های معلق بررسی می‌شوند (یادآوری ۱۰ دقیقه، لغو ۶۰ دقیقه) و یک دسته از پیام همگانی ارسال می‌شود
# ==========================================
[triggers]
crons = ["* * * * *"]

# ==========================================
# متغیرهای محیطی پروژه — همه‌ی PUT_... ها را با اطلاعات فروشگاه خودتان عوض کنید
# (BOT_TOKEN اینجا نیست؛ با «wrangler secret put BOT_TOKEN» تنظیم می‌شود)
# ==========================================
[vars]
SHOP_NAME = "گلاب یاسمین"          # نام فروشگاه در پیام خوش‌آمد
ADMIN_CHAT_ID = "189219108,8315162721,67526515"    # سوپرادمین: همه‌ی امکانات (آیدی عددی؛ در ربات /id بزنید). چند نفر: "111,222"
SUPPORT_CHAT_ID = "" # ادمین پشتیبانی: محصولات و تایید سفارش؛ چند نفر با ویرگول: "333,444" (اگر ندارید خالی بگذارید)
SUPPORT_PHONE = "09194013595"         # دکمه‌ی «ارتباط با ادمین» مستقیم چت تلگرام این شماره را باز می‌کند
SUPPORT_USERNAME = "" # نام کاربری پشتیبانی بدون @ (برای دکمه‌ی «ارتباط با ادمین»)
BOT_USERNAME = "golabeyasminbot"      # بدون @ (برای لینک دعوت)
CHANNEL_USERNAME = ""
CHANNEL_ENABLED = "false"               # "false" = بدون عضویت اجباری کانال
REGISTRATION_ENABLED = "true"
CARD_NUMBER = "6063731047924858"       # موقت: شماره کارت واقعی را اینجا بگذارید و دوباره deploy کنید
CARD_HOLDER = "مرتضی احسانیان چیمه"
PRODUCT_COLUMNS = "3"                  # تعداد دکمه‌ی محصول در هر ردیف منو (۱ تا ۴)
PRODUCT_FEATURED_FIRST = "true"        # "true" = اولین محصول (جایگاه ۱) در یک ردیف تکی
CUSTOM_BOT_ENABLED = "false"           # "true" = دکمه‌ی «🤖 ساخت ربات» (فرم سفارش ساخت ربات)

REFERRAL_REWARD = "10000"
SIGNUP_BONUS = "20000"
REFERRAL_COMMISSION_PERCENT = "0"      # کمیسیون معرف از هر خرید زیرمجموعه (برای فعال‌سازی مثلاً "10")

# کش‌بک: درصدی از مبلغ نهایی پرداختی که بعد از تایید ادمین به کیف پول خریدار برمی‌گردد
CASHBACK_ENABLED = "true"
CASHBACK_PERCENT = "5"

COURIER_FEE = "300000"                 # هزینه‌ی پیک (فقط تهران)
POST_FEE = "300000"                    # هزینه‌ی پست (سایر شهرها)
FREE_SHIPPING_MIN = "5000000"          # از این مبلغ به بالا پیک و پست رایگان

DISCOUNT_ENABLED = "true"              # یا "false" برای غیرفعال کردن کل سیستم تخفیف
DISCOUNT_CODES = ""                    # کدهای ثابت، کنار کدهایی که ادمین با «🎟 کدهای تخفیف» می‌سازد؛ مثال: "OFF10:10,VIP20:20"

# "false" کل سبد خرید و دکمه‌ی روشن/خاموش ادمین را برمی‌دارد و خرید مستقیم فعال می‌شود.
# وقتی "true" است، ادمین با دکمه‌ی «⚙️ سبد خرید» آن را روشن یا خاموش می‌کند.
CART_ENABLED = "true"

# ==========================================
# تنظیمات اتصال به دیتابیس D1
# ==========================================
[[d1_databases]]
binding = "DB"
database_name = "golabeyasamin_db"
database_id = "9ad16036-abfa-4886-87f4-4e07dcdbe4a9"
