<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<!-- عکس پروفایل ربات: دیگ گلابگیری سنتی. تلگرام عکس را دایره‌ای نشان می‌دهد؛ محتوای اصلی وسط است -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #3b1424; }
  svg { display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#fbe3ea"/>
      <stop offset=".55" stop-color="#e98aa8"/>
      <stop offset="1" stop-color="#8e2350"/>
    </radialGradient>
    <linearGradient id="copper" x1="0" x2="1">
      <stop offset="0" stop-color="#7a3b16"/>
      <stop offset=".35" stop-color="#e0915a"/>
      <stop offset=".55" stop-color="#f6c08f"/>
      <stop offset="1" stop-color="#8a4519"/>
    </linearGradient>
    <linearGradient id="copperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3b27a"/>
      <stop offset="1" stop-color="#9b4f1f"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6f00"/>
      <stop offset=".6" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#fff59d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".65"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".3"/></filter>
    <g id="rose">
      <ellipse rx="30" ry="46" transform="rotate(0) translate(0 -30)" fill="#d81b60"/>
      <ellipse rx="30" ry="46" transform="rotate(72) translate(0 -30)" fill="#e91e63"/>
      <ellipse rx="30" ry="46" transform="rotate(144) translate(0 -30)" fill="#d81b60"/>
      <ellipse rx="30" ry="46" transform="rotate(216) translate(0 -30)" fill="#ec407a"/>
      <ellipse rx="30" ry="46" transform="rotate(288) translate(0 -30)" fill="#d81b60"/>
      <ellipse rx="20" ry="30" transform="rotate(36) translate(0 -14)" fill="#f06292" stroke="#ad1457" stroke-width="2"/>
      <ellipse rx="20" ry="30" transform="rotate(180) translate(0 -14)" fill="#f48fb1" stroke="#ad1457" stroke-width="2"/>
      <circle r="12" fill="#ad1457"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="380" fill="#ffffff" opacity=".18"/>

  <!-- اجاق آجری و آتش -->
  <g filter="url(#sh)">
    <rect x="250" y="640" width="400" height="150" rx="16" fill="#8d3b2c"/>
    <g stroke="#6d2a1f" stroke-width="5">
      <path d="M250 690 H650 M250 740 H650"/>
      <path d="M330 640 V690 M430 640 V690 M530 640 V690 M610 640 V690 M290 690 V740 M380 690 V740 M480 690 V740 M580 690 V740 M330 740 V790 M430 740 V790 M530 740 V790 M610 740 V790"/>
    </g>
    <path d="M370 790 V720 Q450 660 530 720 V790 Z" fill="#2b0d10"/>
    <path d="M400 790 C390 750 420 735 415 705 C445 725 440 745 452 752 C455 725 470 712 465 685 C500 715 505 750 500 790 Z" fill="url(#flame)"/>
  </g>

  <!-- دیگ مسی -->
  <g filter="url(#sh)">
    <path d="M260 520 C260 470 300 450 450 450 C600 450 640 470 640 520 L620 640 H280 Z" fill="url(#copper)"/>
    <rect x="250" y="500" width="400" height="26" rx="10" fill="#7a3b16"/>
    <!-- سرپوش گنبدی -->
    <path d="M300 500 C300 380 600 380 600 500 Z" fill="url(#copperV)"/>
    <path d="M330 470 C350 420 420 400 470 402" stroke="#ffe0bf" stroke-width="10" fill="none" stroke-linecap="round" opacity=".7"/>
    <circle cx="450" cy="392" r="18" fill="#7a3b16"/>
    <path d="M272 560 C300 575 600 575 628 560" stroke="#ffe0bf" stroke-width="6" fill="none" opacity=".45"/>
  </g>

  <!-- لوله‌ی انتقال بخار به قرابه -->
  <path d="M590 455 C660 420 700 420 740 470 L790 560" stroke="#a5582a" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M590 455 C660 420 700 420 740 470 L790 560" stroke="#f0b07c" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>

  <!-- قرابه‌ی شیشه‌ای گلاب در آب سرد -->
  <g filter="url(#sh)">
    <path d="M700 640 H880 V770 C880 790 865 800 845 800 H735 C715 800 700 790 700 770 Z" fill="#4fa3c7" opacity=".9"/>
    <path d="M770 560 H810 V590 C850 605 860 640 860 680 V760 C860 778 848 790 830 790 H750 C732 790 720 778 720 760 V680 C720 640 730 605 770 590 Z" fill="url(#glass)" stroke="#ffffffdd" stroke-width="5"/>
    <path d="M724 690 H856 V760 C856 776 846 786 830 786 H750 C734 786 724 776 724 760 Z" fill="#fce4ec" opacity=".95"/>
    <path d="M700 660 C730 650 760 670 790 660 C820 650 850 670 880 660" stroke="#ffffff" stroke-width="4" fill="none" opacity=".7"/>
  </g>

  <!-- قطره‌ی گلاب -->
  <path d="M790 600 C780 618 778 628 790 636 C802 628 800 618 790 600 Z" fill="#ec407a"/>

  <!-- گل‌های محمدی -->
  <g filter="url(#sh)">
    <use href="#rose" transform="translate(205 720) scale(1.15)"/>
    <use href="#rose" transform="translate(150 640) scale(.9)"/>
    <use href="#rose" transform="translate(255 615) scale(.75)"/>
    <ellipse cx="190" cy="790" rx="40" ry="16" fill="#2e7d32" transform="rotate(-20 190 790)"/>
    <ellipse cx="290" cy="780" rx="34" ry="13" fill="#388e3c" transform="rotate(25 290 780)"/>
  </g>

  <!-- عنوان -->
  <text x="512" y="250" text-anchor="middle" font-family="Vazirmatn, Tahoma" font-weight="900" font-size="104" fill="#ffffff" style="paint-order: stroke" stroke="#8e2350" stroke-width="10">گلابگیری</text>
</svg>
</body>
</html>
