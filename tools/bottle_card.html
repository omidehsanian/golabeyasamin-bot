<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<!-- عکس محصول «شیشه ویترای» از روی عکس‌های واقعی پوشه‌ی «سفارشی»؛ خروجی: public/img/shishe-vitray.png -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: 'Vazirmatn', Tahoma, sans-serif; }
  .card { position: relative; width: 1080px; height: 1080px; box-sizing: border-box; padding: 56px 48px;
    background: radial-gradient(circle at 75% 30%, #ffffffb0 0, #ffffff00 45%), linear-gradient(160deg, #e1bee7, #6a1b9a); }
  .top { display: flex; gap: 32px; align-items: center; height: 560px; }
  .pair { flex: none; display: flex; gap: 20px; }
  .box { position: relative; flex: none; height: 560px; width: 250px; border-radius: 28px; overflow: hidden; background: #fff;
    box-shadow: 0 18px 40px #0005; }
  .box img { width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
  .tag { position: absolute; bottom: 14px; right: 50%; transform: translateX(50%); background: #fff; color: #4a148c;
    font-weight: 900; font-size: 26px; padding: 4px 20px; border-radius: 30px; box-shadow: 0 4px 12px #0004; white-space: nowrap; }
  .text { flex: 1; color: #fff; }
  .badge { display: inline-block; background: #fff; color: #6a1b9a; font-weight: 900; font-size: 28px;
    padding: 8px 24px; border-radius: 40px; box-shadow: 0 6px 16px #0003; }
  h1 { margin: 22px 0 18px; font-size: 80px; line-height: 1.15; font-weight: 900; text-shadow: 0 4px 18px #0004; }
  ul { list-style: none; margin: 0; padding: 0; font-size: 29px; line-height: 1.75; text-shadow: 0 2px 8px #0003; }
  .row { margin-top: 44px; height: 370px; display: flex; gap: 20px; }
  .row .box { flex: 1; width: auto; height: 370px; }
  .row .box img { object-position: center 55%; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="pair">
      <div class="box"><img src="../سفارشی/photo_6030549836878253936_y.jpg"><span class="tag">سفید</span></div>
      <div class="box"><img src="../سفارشی/photo_5996995920274329567_x.jpg"><span class="tag">سبز</span></div>
    </div>
    <div class="text">
      <span class="badge">🎨 ویترای دست‌ساز</span>
      <h1>شیشه<br>ویترای</h1>
      <ul>
        <li>🫙 یک لیتری · خالی</li>
        <li>⚪🟢 شیشه‌ی سفید یا سبز</li>
        <li>🌸 طرح و رنگ به انتخاب شما</li>
        <li>🌹 نگهداری بهتر عرقیات</li>
      </ul>
    </div>
  </div>
  <div class="row">
    <div class="box"><img src="../سفارشی/photo_6030549836878253897_y.jpg"></div>
    <div class="box"><img src="../سفارشی/photo_5996995920274329566_y.jpg"></div>
  </div>
</div>
</body>
</html>
