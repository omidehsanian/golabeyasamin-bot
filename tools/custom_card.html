<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<!-- عکس محصول «گلاب سفارشی دوآتیشه» از روی عکس‌های واقعی پوشه‌ی «سفارشی»؛ خروجی: public/img/golab-sefareshi.png -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: 'Vazirmatn', Tahoma, sans-serif; }
  .card { position: relative; width: 1080px; height: 1080px; box-sizing: border-box; padding: 56px 48px;
    background: radial-gradient(circle at 75% 30%, #ffffffb0 0, #ffffff00 45%), linear-gradient(160deg, #f8bbd0, #ad1457); }
  .top { display: flex; gap: 40px; align-items: center; height: 560px; }
  .box { flex: none; height: 560px; width: 340px; border-radius: 28px; overflow: hidden; background: #fff;
    box-shadow: 0 18px 40px #0005; }
  .box img { width: 100%; height: 100%; object-fit: cover; }
  .text { flex: 1; color: #fff; }
  .badge { display: inline-block; background: #fff; color: #ad1457; font-weight: 900; font-size: 30px;
    padding: 8px 26px; border-radius: 40px; box-shadow: 0 6px 16px #0003; }
  h1 { margin: 22px 0 18px; font-size: 84px; line-height: 1.15; font-weight: 900; text-shadow: 0 4px 18px #0004; }
  ul { list-style: none; margin: 0; padding: 0; font-size: 34px; line-height: 1.75; text-shadow: 0 2px 8px #0003; }
  .row { margin-top: 44px; height: 370px; border-radius: 28px; overflow: hidden; box-shadow: 0 18px 40px #0005; }
  .row img { width: 100%; height: 100%; object-fit: cover; object-position: center 60%; }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="box"><img src="../سفارشی/photo_5996995920274329572_y.jpg"></div>
    <div class="text">
      <span class="badge">🎁 سفارشی</span>
      <h1>گلاب<br>دوآتیشه</h1>
      <ul>
        <li>🎨 شیشه‌ی نقاشی‌شده با دست</li>
        <li>🎁 همراه جعبه‌ی هدیه</li>
        <li>🌹 غلیظ و معطر · دو بار تقطیر</li>
      </ul>
    </div>
  </div>
  <div class="row"><img src="../سفارشی/photo_5996995920274329566_y.jpg"></div>
</div>
</body>
</html>
